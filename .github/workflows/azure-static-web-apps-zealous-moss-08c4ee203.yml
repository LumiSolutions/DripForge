name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MOSS_08C4EE203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Next.js Hybrid + output: standalone (next.config.ts) ######
          # Oryx fuehrt "npm run build" aus (inkl. prepare-standalone.mjs).
          # output_location leer: Azure erkennt das Standalone-Paket unter .next/standalone.
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_api_build: true
          app_build_command: "npm run build"
          ###### Ende Build-Konfiguration ######
        env:
          # Node-Version für Oryx-Build und Azure-Warm-up
          FORWARD_NODE_VERSION: "20"
          NODE_VERSION: "20"
          # Schnellerer Next.js-Build (keine Source Maps in CI)
          NEXT_DISABLE_SOURCEMAPS: "1"
          # Platzhalter nur für den CI-Build — Runtime nutzt Portal-Secrets
          COSMOSDB_ENDPOINT: "https://build-placeholder.documents.azure.com:443/"
          COSMOSDB_KEY: "build-only-placeholder-not-used-in-production"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MOSS_08C4EE203 }}
          action: "close"
